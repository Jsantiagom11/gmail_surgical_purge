name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.33"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Locked environment
        run: uv sync --locked --dev
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Strict types
        run: uv run --frozen mypy
      - name: Offline tests and coverage
        run: uv run --frozen pytest
      - name: Publication privacy guard
        run: uv run --frozen python scripts/check_publication.py
      - name: Build distributions
        run: uv build
      - name: Validate distributions
        run: uv run --frozen twine check dist/*
      - name: Isolated wheel smoke test
        run: uv run --isolated --no-project --with dist/*.whl gmail-purge --version
